apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: github-sensor
  namespace: argo-events
spec:
  template:
    serviceAccountName: argo-events-sa
  dependencies:
    # RULE 1: If account-service changed

    - name: github-push
      eventSourceName: github-eventsource
      eventName: piggymetrics-push
      # To filter only when account-service changes, you could add:
      # filters:
      #   data:
      #     - path: body.commits.#.modified.#
      #       type: string
      #       value:
      #         - "account-service/.*"
    # # RULE 2: If auth-service changed
    # - name: auth-service-changed
    #   eventSourceName: github-eventsource
    #   eventName: piggymetrics-push
    #   filters:
    #     data:
    #       - path: body.commits.#.modified.#
    #         type: string
    #         value: [ "auth-service/.*" ]


  triggers:
    - template:
        name: account-service-trigger
        k8s:
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: account-service-ci-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: account-service-template
