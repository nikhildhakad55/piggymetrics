# Gateway Service and Blue/Green Deployments
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: piggymetrics
spec:
  type: NodePort
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30080
  selector:
    app: gateway
    color: blue
    
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-blue
  namespace: piggymetrics
  labels:
    app: gateway
    color: blue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
      color: blue
  template:
    metadata:
      labels:
        app: gateway
        color: blue
    spec:
      containers:
      - name: gateway
        image: sqshq/piggymetrics-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CONFIG_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: piggymetrics-secrets
              key: CONFIG_SERVICE_PASSWORD
        - name: EUREKA_CLIENT_ENABLED
          value: "false"
        - name: RIBBON_EUREKA_ENABLED
          value: "false"
        - name: ACCOUNT-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://account-service:6000"
        - name: STATISTICS-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://statistics-service:7000"
        - name: NOTIFICATION-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://notification-service:8000"
        ports:
        - containerPort: 4000
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-green
  namespace: piggymetrics
  labels:
    app: gateway
    color: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app: gateway
      color: green
  template:
    metadata:
      labels:
        app: gateway
        color: green
    spec:
      containers:
      - name: gateway
        image: sqshq/piggymetrics-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CONFIG_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: piggymetrics-secrets
              key: CONFIG_SERVICE_PASSWORD
        - name: EUREKA_CLIENT_ENABLED
          value: "false"
        - name: RIBBON_EUREKA_ENABLED
          value: "false"
        - name: ACCOUNT-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://account-service:6000"
        - name: STATISTICS-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://statistics-service:7000"
        - name: NOTIFICATION-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://notification-service:8000"
        ports:
        - containerPort: 4000
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"

