apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: piggymetrics
spec:
  type: NodePort
  ports:
  - port: 4000
    targetPort: 4000
    nodePort: 30080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: piggymetrics
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: sqshq/piggymetrics-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: CONFIG_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: piggymetrics-secrets
              key: CONFIG_SERVICE_PASSWORD
        - name: EUREKA_CLIENT_ENABLED
          value: "false"
        - name: RIBBON_EUREKA_ENABLED
          value: "false"
        - name: ACCOUNT-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://account-service:6000"
        - name: STATISTICS-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://statistics-service:7000"
        - name: NOTIFICATION-SERVICE_RIBBON_LISTOFSERVERS
          value: "http://notification-service:8000"
        ports:
        - containerPort: 4000
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "100m"
