kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraPortMappings:
  - containerPort: 30080
    hostPort: 80
    listenAddress: "0.0.0.0"
  - containerPort: 30761
    hostPort: 8761
    listenAddress: "0.0.0.0"
  - containerPort: 30900
    hostPort: 9000
    listenAddress: "0.0.0.0"
